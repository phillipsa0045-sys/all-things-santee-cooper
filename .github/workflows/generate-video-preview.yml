name: Generate Facebook preview image
on:
  push:
    paths:
      - 'assets/videos-banner.svg'
      - '.github/workflows/generate-video-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Render JPG preview from site banner
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          import io
          from pathlib import Path
          import cairosvg
          from PIL import Image
          source=Path("assets/videos-banner.svg")
          png=cairosvg.svg2png(url=str(source),output_width=1200,output_height=630)
          image=Image.open(io.BytesIO(png)).convert("RGB")
          image.save("assets/videos-facebook-preview.jpg",quality=88,optimize=True,progressive=True)
          print("Created assets/videos-facebook-preview.jpg")
          PY
      - name: Commit preview image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/videos-facebook-preview.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Render Facebook JPG preview for video library"
            git push
          fi
